<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratios and the coordinate plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#04212a; --sea:#0b4450; --sonar:#6fe3d3; --jelly:#ff9ad0;
  --beacon:#e8660f; --paper:#f7faf8; --ink:#12272d; --text:#eef9f7;
  --muted:#b3dcd7; --guide:#0a6f78; --sub:#ffd166;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]), :root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--abyss);color:var(--text);font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;
  background:
    linear-gradient(105deg,transparent 0 30%,rgba(111,227,211,.05) 30% 34%,transparent 34% 52%,rgba(111,227,211,.04) 52% 55%,transparent 55%),
    linear-gradient(180deg,#0f5a66 0%,#094150 40%,#05262f 100%);
  overflow:hidden;border-radius:6px}

/* jellyfish */
.jelly{position:absolute;pointer-events:none;z-index:0;filter:drop-shadow(0 0 18px rgba(255,154,208,.55));
  animation:drift 7s ease-in-out infinite, glow 4s ease-in-out infinite;animation-play-state:paused}
.jelly.aqua{filter:drop-shadow(0 0 18px rgba(111,227,211,.6))}
body.moving .jelly{animation-play-state:running}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}

/* slides */
#slides{position:absolute;left:0;top:0;width:1600px;height:824px;z-index:1}
.slide{position:absolute;inset:0;padding:52px 72px 40px;display:flex;flex-direction:column;gap:22px;
  opacity:0;visibility:hidden;transition:opacity .45s ease}
.slide.cur{opacity:1;visibility:visible}
body.still .slide{transition:none}
h1{font-size:84px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.5px;max-width:1100px}
h2{font-size:60px;line-height:1.1;margin:0;font-weight:700}
p{margin:0}
.row{flex:1;display:flex;gap:48px;align-items:center;min-height:0}
.col{display:flex;flex-direction:column;gap:22px}
.side{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
.lead{font-size:44px;color:var(--muted)}
.body{font-size:40px;line-height:1.35}
.prob{font-size:50px;line-height:1.3}
.prob b{color:var(--sub)}
.qs{margin:0;padding-left:56px;font-size:42px;line-height:1.45}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 0 0 4px rgba(111,227,211,.35),0 18px 40px rgba(0,0,0,.35);flex:none}
.prompt{font-size:150px;font-weight:700;color:var(--sub);line-height:1}
.pair{font-weight:700;color:var(--sub)}
.note{font-size:34px;color:var(--muted)}

/* reveals */
.rv{opacity:0;transition:opacity .35s ease}
.rv.on{opacity:1}
body.still .rv{transition:none}
.ans{font-size:42px;font-weight:700;background:rgba(111,227,211,.16);border:3px solid var(--sonar);border-radius:16px;padding:16px 26px;align-self:flex-start}

/* ratio tables */
.rt{border-collapse:collapse;font-size:46px;font-weight:700}
.rt th,.rt td{border:3px solid var(--ink);height:104px;min-width:128px;text-align:center}
.rt th{background:#d9ece8;min-width:240px;font-size:38px;text-align:left;padding:0 22px}
.vt{border-collapse:collapse;font-size:40px;font-weight:700}
.vt th,.vt td{border:3px solid var(--ink);height:66px;width:200px;padding:0 10px;text-align:center}
.vt th{background:#d9ece8;font-size:32px}
.vt.tight td,.vt.tight th{height:58px}
.fix{color:var(--beacon)}

/* grid */
svg.grid{display:block}
.gl{stroke:#6f8a8e;stroke-width:2}
.ax{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.tk{font:700 28px "Atkinson Hyperlegible",Verdana,sans-serif;fill:var(--ink)}
.at{font:700 30px "Atkinson Hyperlegible",Verdana,sans-serif;fill:var(--guide)}
.gd{stroke:var(--guide);stroke-width:5;stroke-dasharray:12 8}
.gt{font:700 30px "Atkinson Hyperlegible",Verdana,sans-serif;fill:var(--guide);paint-order:stroke;stroke:#fff;stroke-width:7px}
.lbl{font:700 30px "Atkinson Hyperlegible",Verdana,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:7px}
.ln{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s ease, opacity .2s}
.ln.on{stroke-dashoffset:0}
body.still .ln{transition:none}
.ping{opacity:0}
.rv.on .ping{animation:ping 1.3s ease-out 2}
body.still .rv.on .ping{animation:none}
@keyframes ping{0%{opacity:.9;r:14}100%{opacity:0;r:48}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* dividers & hero */
.divider{justify-content:center;gap:26px;padding-left:140px}
.depth{font-size:40px;color:var(--sonar);font-weight:700}
.divider h1{font-size:104px}
.hero{justify-content:center;gap:30px;padding-left:120px}
.mission{margin:0;padding-left:60px;font-size:42px;line-height:1.55}
.hint{font-size:32px;color:var(--muted)}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:2;display:flex;align-items:center;gap:20px;padding:0 28px;background:rgba(3,26,33,.72);border-top:2px solid rgba(111,227,211,.3)}
#track{position:relative;flex:1;height:56px}
#track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(111,227,211,.45)}
#subwrap{position:absolute;top:4px;left:0;width:90px;height:48px;transition:left 1.1s cubic-bezier(.3,.7,.3,1)}
body.still #subwrap{transition:none}
body.moving #sub{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bubble{position:absolute;width:10px;height:10px;border:2px solid var(--sonar);border-radius:50%;animation:rise 1.4s ease-out forwards}
@keyframes rise{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}
#goal{position:absolute;right:-6px;top:10px;font-size:30px}
button{font:700 24px "Atkinson Hyperlegible",Verdana,sans-serif;color:var(--text);background:rgba(111,227,211,.14);border:2px solid rgba(111,227,211,.55);border-radius:12px;padding:8px 18px;cursor:pointer}
button:hover{background:rgba(111,227,211,.28)}
button:focus-visible{outline:4px solid var(--sub);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
#reveal{background:var(--sonar);color:var(--ink);border-color:var(--sonar)}
#count{font-size:26px;color:var(--muted);min-width:78px;text-align:center}

@media print{
  body{overflow:visible;background:#fff}
  #viewport{position:static}
  #stage{position:static;transform:none!important;width:auto;height:auto;background:#fff}
  .jelly,#bar{display:none}
  #slides{position:static;width:1600px;height:auto;zoom:.58}
  .slide{position:relative;opacity:1;visibility:visible;height:824px;page-break-after:always;color:#12272d}
  .lead,.note,.hint,.depth{color:#0a6f78}.prob b,.prompt,.pair{color:#b34700}
  .ans{display:none}
  @page{size:landscape;margin:12mm}
}
</style>
</head>
<body class="still">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a6f78"/>
    </marker>
    <radialGradient id="jp" cx="50%" cy="35%" r="60%"><stop offset="0" stop-color="#ffd9ec"/><stop offset="1" stop-color="#ff7fc2" stop-opacity=".55"/></radialGradient>
    <radialGradient id="ja" cx="50%" cy="35%" r="60%"><stop offset="0" stop-color="#d8fff9"/><stop offset="1" stop-color="#4fd1c5" stop-opacity=".5"/></radialGradient>
    <symbol id="jelly" viewBox="0 0 100 150">
      <path d="M8 55 C8 18 92 18 92 55 C80 50 70 58 62 53 C55 58 45 58 38 53 C30 58 20 50 8 55Z"/>
      <g fill="none" stroke-width="4" stroke-linecap="round" opacity=".8">
        <path d="M22 56 C16 80 30 96 22 128"/><path d="M40 58 C34 86 48 104 40 144"/>
        <path d="M60 58 C66 86 52 104 60 140"/><path d="M78 56 C84 80 70 96 78 124"/>
      </g>
    </symbol>
  </defs>
</svg>

<main id="viewport" aria-label="Lesson slides">
  <div id="stage">
    <div aria-hidden="true" class="jelly" style="left:1450px;top:18px;width:96px"><svg viewBox="0 0 100 150" width="96" height="144" fill="url(#jp)" stroke="#ffb6dc"><use href="#jelly"/></svg></div>
    <div aria-hidden="true" class="jelly aqua" style="left:1544px;top:380px;width:48px;animation-delay:-2s"><svg viewBox="0 0 100 150" width="48" height="72" fill="url(#ja)" stroke="#9ff0e6"><use href="#jelly"/></svg></div>
    <div aria-hidden="true" class="jelly" style="left:8px;top:600px;width:54px;animation-delay:-4s"><svg viewBox="0 0 100 150" width="54" height="81" fill="url(#jp)" stroke="#ffb6dc"><use href="#jelly"/></svg></div>
    <div aria-hidden="true" class="jelly aqua" style="left:10px;top:230px;width:50px;animation-delay:-1s"><svg viewBox="0 0 100 150" width="50" height="75" fill="url(#ja)" stroke="#9ff0e6"><use href="#jelly"/></svg></div>

    <div id="slides"></div>
    <div id="live" class="sr" aria-live="polite"></div>

    <div id="bar">
      <div id="track" role="img" aria-label="Progress: the submarine moves forward each time an answer is revealed">
        <div id="subwrap"><svg id="sub" viewBox="0 0 90 48" width="90" height="48" aria-hidden="true">
          <rect x="34" y="6" width="18" height="12" rx="3" fill="#ffd166" stroke="#12272d" stroke-width="2.5"/>
          <line x1="44" y1="6" x2="44" y2="0" stroke="#12272d" stroke-width="3"/>
          <ellipse cx="44" cy="28" rx="36" ry="15" fill="#ffd166" stroke="#12272d" stroke-width="2.5"/>
          <circle cx="36" cy="28" r="5" fill="#6fe3d3" stroke="#12272d" stroke-width="2"/>
          <circle cx="54" cy="28" r="5" fill="#6fe3d3" stroke="#12272d" stroke-width="2"/>
          <path d="M8 28 L1 20 L1 36 Z" fill="#12272d"/>
        </svg></div>
        <span id="goal" aria-hidden="true">🐚</span>
      </div>
      <button id="prev" aria-label="Previous slide">Back</button>
      <button id="reveal">Reveal</button>
      <button id="hide" title="Hide this slide's answers again">Hide answers</button>
      <button id="next" aria-label="Next">Next</button>
      <span id="count">1 / 1</span>
      <button id="motion" title="Turn the jellyfish movement on or off">Motion: off</button>
      <button id="fs" title="Full screen">Full screen</button>
    </div>
  </div>
</main>

<script>
/* ---------- helpers ---------- */
function g(o){
  const xmax=o.xmax,ymax=o.ymax,ys=o.ys||1,w=o.w,h=o.h;
  const L=o.yt?112:70,T=24,R=30,B=o.xt?100:60; const tf=o.ys>1?'style="font-size:25px"':'';
  const X=x=>L+x/xmax*w, Y=y=>T+h-y/ymax*h;
  let s=`<svg class="grid" viewBox="0 0 ${L+w+R} ${T+h+B}" width="${L+w+R}" height="${T+h+B}" role="img" aria-label="${o.label||'Coordinate grid'}">`;
  s+=`<rect x="${L}" y="${T}" width="${w}" height="${h}" fill="#fff"/>`;
  for(let x=0;x<=xmax;x++) s+=`<line class="gl" x1="${X(x)}" y1="${T}" x2="${X(x)}" y2="${T+h}"/><text class="tk" x="${X(x)}" y="${T+h+34}" text-anchor="middle">${x}</text>`;
  for(let y=0;y<=ymax;y+=ys) s+=`<line class="gl" x1="${L}" y1="${Y(y)}" x2="${L+w}" y2="${Y(y)}"/>${y===0?'':`<text class="tk" ${tf} x="${L-14}" y="${Y(y)+9}" text-anchor="end">${y}</text>`}`;
  s+=`<text class="tk" x="${L-14}" y="${Y(0)+8}" text-anchor="end">0</text>`;
  s+=`<line class="ax" x1="${X(0)}" y1="${T-4}" x2="${X(0)}" y2="${Y(0)}"/><line class="ax" x1="${X(0)}" y1="${Y(0)}" x2="${L+w+6}" y2="${Y(0)}"/>`;
  if(o.xt) s+=`<text class="at" x="${L+w/2}" y="${T+h+82}" text-anchor="middle">${o.xt}</text>`;
  if(o.yt) s+=`<text class="at" transform="translate(32 ${T+h/2}) rotate(-90)" text-anchor="middle">${o.yt}</text>`;
  if(o.ex) s+=o.ex(X,Y);
  return s+'</svg>';
}
function P(X,Y,x,y,o={}){
  const c=o.color||'#e8660f', a=o.step?` class="rv" data-step="${o.step}"`:'';
  return `<g${a}><circle class="ping" cx="${X(x)}" cy="${Y(y)}" r="14" fill="none" stroke="${c}" stroke-width="4"/>`+
    `<circle cx="${X(x)}" cy="${Y(y)}" r="13" fill="${c}" stroke="#12272d" stroke-width="3"/>`+
    (o.emoji?`<text x="${X(x)+14}" y="${Y(y)-14}" font-size="40">${o.emoji}</text>`:'')+`</g>`;
}
function Gd(X,Y,x,y,step){
  let s=`<g class="rv" data-step="${step}">`;
  if(x>0) s+=`<line class="gd" x1="${X(0)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(0)}" marker-end="url(#ah)"/><text class="gt" x="${(X(0)+X(x))/2}" y="${Y(0)-16}" text-anchor="middle">${x} right</text>`;
  if(y>0) s+=`<line class="gd" x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(y)}" marker-end="url(#ah)"/><text class="gt" x="${X(x)+ (x>6?-16:16)}" y="${(Y(0)+Y(y))/2+8}" text-anchor="${x>6?'end':'start'}">${y} up</text>`;
  return s+'</g>';
}
function Ln(X,Y,x2,y2,step,color){
  return `<line class="rv ln" data-step="${step}" pathLength="1" x1="${X(0)}" y1="${Y(0)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${color}" stroke-width="6" stroke-linecap="round"/>`;
}
function rt(a,b){
  const blanks='<td></td>'.repeat(7);
  return `<table class="rt"><tr><th>${a}</th>${blanks}</tr><tr><th>${b}</th>${blanks}</tr></table>`;
}

/* ---------- slides ---------- */
const S=[];
const add=(title,html,cls='')=>S.push({title,html,cls});
const OR='#e8660f', TL='#0b6e8a';
const seg=(X,Y,a,b,c,d,col,w=6)=>`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
const line=(X,Y,m,xm,ym,col,step)=>{const e=Math.min(xm,ym/m);return step?`<g class="rv" data-step="${step}">${seg(X,Y,0,0,e,e*m,col)}</g>`:seg(X,Y,0,0,e,e*m,col)};
const tri=(X,Y,x1,y1,x2,y2,step,col='#0b6e8a',p='')=>`<g class="rv" data-step="${step}"><line class="gd" style="stroke:${col}" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y1)}"/><line class="gd" style="stroke:${col}" x1="${X(x2)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/><text class="gt" style="fill:${col}" x="${(X(x1)+X(x2))/2}" y="${p[0]=='B'?Y(y1)-16:Y(y1)+34}" text-anchor="middle">${p}run ${x2-x1}</text><text class="gt" style="fill:${col}" x="${p[0]=='B'?X(x2)-16:X(x2)+16}" y="${(Y(y1)+Y(y2))/2+8}" text-anchor="${p[0]=='B'?'end':'start'}">${p}rise ${y2-y1}</text></g>`;
function vt(a,b,rows){return `<table class="vt"><tr><th>${a}</th><th>${b}</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`}
const part=(n,t,s)=>add('Part '+n,`<p class="depth">Part ${n} of 4</p><h1>${t}</h1><p class="lead">${s}</p>`,'divider');

add('Title',`<h1 style="font-size:104px;max-width:1400px">Slope and y = mx</h1>
 <p class="lead" style="font-size:48px;color:var(--text)">LS V07B Fundamentals of Math II</p>
 <p class="lead">October 5, 2026</p><p class="lead" style="color:var(--sonar);font-weight:700">Dr. Maya</p>`,'hero');
add("Today's objectives",`<h1>Today's objectives</h1><p class="lead">By the end of the lesson, you will be able to:</p>
 <ol class="mission"><li>Find the slope of a line using rise over run.</li><li>Find the slope from a ratio table.</li><li>Write and check an equation of the form y = mx.</li></ol>`,'hero');

part(1,'Comparing steepness','Which line climbs faster?');
add('Comparing two graphs',`<h2>Which line climbs faster?</h2>
 <div class="row"><div class="panel">${g({xmax:5,ymax:30,ys:5,w:400,h:440,xt:'Days (x)',yt:'Fish (y)',label:'Fish graph: line through the origin and (5, 30).',ex:(X,Y)=>line(X,Y,6,5,30,OR)})}</div>
 <div class="panel">${g({xmax:5,ymax:30,ys:5,w:400,h:440,xt:'Trips (x)',yt:'Vehicles (y)',label:'Ferry graph: line through the origin and (5, 20).',ex:(X,Y)=>line(X,Y,4,5,30,TL)})}</div></div>
 <p class="prob">Both graphs use the same scale. Which line is steeper?</p>
 <div class="ans rv" data-step="1">The fish line is steeper: 6 fish per day is a faster rate than 4 vehicles per trip.</div>`);
add('Rise over run',`<h2>Slope: rise over run</h2><div class="row"><div class="side body">
 <p><b>Slope</b> tells how steep a line is.</p><p><b>Run</b>: how far you move right.</p><p><b>Rise</b>: how far you move up.</p>
 <p class="prompt">slope = rise ÷ run</p><div class="ans rv" data-step="2">Run 1, rise 2. Slope = 2 ÷ 1 = 2</div></div>
 <div class="panel">${g({xmax:6,ymax:12,ys:2,w:450,h:450,label:'Line through the origin with points (1, 2) and (2, 4). Moving 1 right and 2 up.',ex:(X,Y)=>line(X,Y,2,6,12,OR)+P(X,Y,1,2)+P(X,Y,2,4)+tri(X,Y,1,2,2,4,1)})}</div></div>`);

part(2,'Slope from a graph','Count the rise and the run');
[[1,8,8,1],[2,6,12,2],[3,4,12,2],[4,3,12,2],[5,3,15,5]].forEach((c,i)=>{const m=c[0];add('Slope from a graph '+(i+1),`<h2>Find the slope (${i+1} of 5)</h2>
 <div class="row"><div class="side"><p class="prob">Use the two marked points. Count the run, then the rise.</p><p class="body">Write the slope on your whiteboard.</p>
 <div class="ans rv" data-step="2">Rise ${m} ÷ run 1 = <span class="pair">${m}</span></div></div>
 <div class="panel">${g({xmax:c[1],ymax:c[2],ys:c[3],w:520,h:520,label:`Line through the origin with marked points (1, ${m}) and (2, ${2*m}).`,ex:(X,Y)=>line(X,Y,m,c[1],c[2],OR)+P(X,Y,1,m)+P(X,Y,2,2*m)+tri(X,Y,1,m,2,2*m,1)})}</div></div>`)});
add('Same line, different points',`<h2>The slope stays the same</h2><div class="row"><div class="side body">
 <p>Measure the same line between two different pairs of points.</p>
 <p style="color:#ffb066"><b>Pair A:</b> (1, 2) to (2, 4)</p><p style="color:#8fe3f5"><b>Pair B:</b> (2, 4) to (5, 10)</p>
 <div class="ans rv" data-step="1">Pair A: 2 ÷ 1 = 2</div><div class="ans rv" data-step="2">Pair B: 6 ÷ 3 = 2</div>
 <div class="ans rv" data-step="3">A straight line has one slope everywhere.</div></div>
 <div class="panel">${g({xmax:6,ymax:12,ys:2,w:450,h:450,label:'Line y = 2x. Triangle A from (1, 2) to (2, 4). Triangle B from (2, 4) to (5, 10).',ex:(X,Y)=>line(X,Y,2,6,12,'#555')+P(X,Y,1,2)+P(X,Y,2,4)+P(X,Y,5,10)+tri(X,Y,1,2,2,4,1,'#b34700','A: ')+tri(X,Y,2,4,5,10,2,'#1b4f9c','B: ')})}</div></div>`);
add('Same line, different points: practice',`<h2>Practice: same line, different points</h2><div class="row"><div class="side body">
 <p>Find the slope between each pair of points.</p>
 <p style="color:#ffb066"><b>Pair A:</b> (1, 3) to (2, 6)</p><p style="color:#8fe3f5"><b>Pair B:</b> (2, 6) to (4, 12)</p>
 <div class="ans rv" data-step="1">Pair A: 3 ÷ 1 = 3</div><div class="ans rv" data-step="2">Pair B: 6 ÷ 2 = 3</div>
 <div class="ans rv" data-step="3">Same line, same slope: 3.</div></div>
 <div class="panel">${g({xmax:5,ymax:15,ys:3,w:450,h:450,label:'Line y = 3x. Pair A from (1, 3) to (2, 6). Pair B from (2, 6) to (4, 12).',ex:(X,Y)=>line(X,Y,3,5,15,'#555')+P(X,Y,1,3)+P(X,Y,2,6)+P(X,Y,4,12)+tri(X,Y,1,3,2,6,1,'#b34700','A: ')+tri(X,Y,2,6,4,12,2,'#1b4f9c','B: ')})}</div></div>`);

part(3,'Slope and ratio tables','Slope is the unit rate');
add('Slope from a table',`<h2>Slope from a ratio table</h2><div class="row"><div class="side">
 <div class="panel" style="align-self:flex-start">${vt('Trips (x)','Vehicles (y)',[[1,4],[2,8],[3,12],[4,16]])}</div></div><div class="side body">
 <p>The unit rate is the y-value when x is 1.</p><p>Any row works: <span class="pair">y ÷ x</span></p>
 <div class="ans rv" data-step="1">12 ÷ 3 = 4</div><div class="ans rv" data-step="2">The slope is 4 vehicles per trip.</div></div></div>`);
add('Slope from a table: practice',`<h2>Practice: slope from a ratio table</h2><div class="row"><div class="side">
 <div class="panel" style="align-self:flex-start">${vt('Hours (x)','Miles (y)',[[2,18],[3,27],[5,45]])}</div></div><div class="side body">
 <p>A boat travels at a constant speed.</p><p>Find the slope. Use any row: <span class="pair">y ÷ x</span></p>
 <div class="ans rv" data-step="1">27 ÷ 3 = 9</div><div class="ans rv" data-step="2">The slope is 9 miles per hour.</div></div></div>`);
add('Introducing y = mx',`<h2>The equation y = mx</h2><div class="body"><p class="prompt">y = mx</p>
 <p class="prob"><span class="pair">y</span> &nbsp;→&nbsp; output</p>
 <p class="prob"><span class="pair">x</span> &nbsp;→&nbsp; input</p>
 <p class="prob"><span class="pair">m</span> &nbsp;→&nbsp; slope (the unit rate)</p></div>`);
add('Using y = mx: fish',`<h2>Using y = mx: fish</h2><div class="body">
 <p>A fisherman catches fish at a constant rate.</p>
 <p class="prob">Given: <span class="pair">m = 6</span> fish per day and <span class="pair">x = 5</span> days</p>
 <p class="prob">Find y, the number of fish.</p>
 <div class="ans rv" data-step="1">Write the equation: y = mx</div><div class="ans rv" data-step="2">Substitute: y = 6 · 5</div><div class="ans rv" data-step="3">y = 30 fish</div></div>`);
add('Using y = mx: turtle',`<h2>Using y = mx: turtle</h2><div class="body">
 <p>A sea turtle swims at a constant rate.</p>
 <p class="prob">Given: <span class="pair">m = 2</span> miles per hour and <span class="pair">x = 7</span> hours</p>
 <p class="prob">Find y, the distance in miles.</p>
 <div class="ans rv" data-step="1">Write the equation: y = mx</div><div class="ans rv" data-step="2">Substitute: y = 2 · 7</div><div class="ans rv" data-step="3">y = 14 miles</div></div>`);
[['Hours (x)','Miles (y)',[[1,7],[2,14],[3,21],[5,35]],7,'a whale'],['Days (x)','Fish (y)',[[1,5],[2,10],[4,20],[6,30]],5,'a fisherman'],['Dives (x)','Shells (y)',[[3,15],[4,20],[8,40]],5,'a diver']].forEach((c,i)=>{const m=c[3];add('Write the equation '+(i+1),`<h2>Write the equation (${i+1} of 5)</h2><div class="row"><div class="side">
 <div class="panel" style="align-self:flex-start">${vt(c[0],c[1],c[2])}</div>${i<2?'<p class="note">The row where x = 1 is the unit rate.</p>':''}<ol class="qs"><li>Find the slope m.</li><li>Write the equation.</li><li>Find y when x = 10.</li></ol></div>
 <div class="side"><div class="ans rv" data-step="1">m = ${c[2][0][1]} ÷ ${c[2][0][0]} = ${m}</div><div class="ans rv" data-step="2">y = ${m}x</div><div class="ans rv" data-step="3">y = ${m} · 10 = ${m*10}</div></div></div>`)});
[[3,5,5,15],[4,4,4,16]].forEach((c,i)=>{const m=c[3]/c[0],xm=c[0]+2;add('Write the equation '+(i+4),`<h2>Write the equation (${i+4} of 5)</h2><div class="row"><div class="side">
 <p class="prob">The line passes through the origin and the marked point.</p><ol class="qs"><li>Find the slope m.</li><li>Write the equation.</li><li>Find y when x = 10.</li></ol>
 <div class="ans rv" data-step="1">m = ${c[3]} ÷ ${c[0]} = ${m}</div><div class="ans rv" data-step="2">y = ${m}x</div><div class="ans rv" data-step="3">y = ${m} · 10 = ${m*10}</div></div>
 <div class="panel">${g({xmax:xm,ymax:m*xm,ys:m,w:500,h:500,label:`Line through the origin and the point (${c[0]}, ${c[3]}).`,ex:(X,Y)=>line(X,Y,m,xm,m*xm,OR)+P(X,Y,c[0],c[3])+`<text class="lbl" x="${X(c[0])+20}" y="${Y(c[3])+40}" fill="#b34700">(${c[0]}, ${c[3]})</text>`})}</div></div>`)});

add('Summary',`<h1>Summary</h1><ol class="mission"><li>Slope = rise ÷ run.</li><li>A straight line has the same slope everywhere.</li><li>From a table, slope = y ÷ x = the unit rate.</li><li>For a line through the origin, y = mx.</li></ol>`,'hero');

/* ---------- engine ---------- */
const slidesEl=document.getElementById('slides');
S.forEach(s=>{const sec=document.createElement('section');sec.className='slide '+s.cls;sec.setAttribute('aria-label',s.title);sec.innerHTML=s.html;slidesEl.appendChild(sec)});
const secs=[...document.querySelectorAll('.slide')];
const maxS=secs.map(sec=>Math.max(0,...[...sec.querySelectorAll('[data-step]')].map(e=>+e.dataset.step)));
const k=secs.map(()=>0);
const best=secs.map(()=>0);
const total=maxS.reduce((a,b)=>a+b,0);
let cur=0, motionOn=false, mTimer=null;
const $=id=>document.getElementById(id);
const subwrap=$('subwrap'), track=$('track');

function store(key,val){try{localStorage.setItem('slope-'+key,val)}catch(e){}}
function load(key){try{return localStorage.getItem('slope-'+key)}catch(e){return null}}

function apply(i){secs[i].querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('on',+e.dataset.step<=k[i]))}
function moveSub(){
  const done=best.reduce((a,b)=>a+b,0), w=track.clientWidth-130;
  subwrap.style.left=(total?done/total:0)*w+'px';
}
function bubbles(){
  if(!motionOn) return;
  for(let n=0;n<3;n++){
    const b=document.createElement('span');b.className='bubble';
    b.style.left=(subwrap.offsetLeft+4+n*8)+'px';b.style.top=(10+n*4)+'px';b.style.animationDelay=(n*.15)+'s';
    track.appendChild(b);setTimeout(()=>b.remove(),2000);
  }
}
function kick(){
  if(!motionOn) return;
  document.body.classList.add('moving');
  clearTimeout(mTimer);mTimer=setTimeout(()=>document.body.classList.remove('moving'),10000);
}
function upd(){
  $('count').textContent=(cur+1)+' / '+secs.length;
  $('reveal').disabled=k[cur]>=maxS[cur];
  $('hide').disabled=k[cur]===0;
  $('prev').disabled=cur===0;
  $('next').disabled=cur===secs.length-1;
}
function go(i){
  if(i<0||i>=secs.length) return;
  secs[cur].classList.remove('cur');cur=i;k[cur]=0;apply(cur);secs[cur].classList.add('cur');
  secs.forEach((x,j)=>x.setAttribute('aria-hidden',j===cur?'false':'true'));
  $('live').textContent='Slide '+(cur+1)+' of '+secs.length+': '+S[cur].title;
  store('slide',cur);kick();upd();
}
function reveal(){
  if(k[cur]>=maxS[cur]) return false;
  k[cur]++;best[cur]=Math.max(best[cur],k[cur]);apply(cur);moveSub();bubbles();upd();
  const shown=[...secs[cur].querySelectorAll('.ans.on,p.rv.on')].pop(); if(shown) $('live').textContent=shown.textContent;
  return true;
}
function next(){ go(cur+1) }
function hide(){ k[cur]=0;apply(cur);upd() }
function setMotion(on){
  motionOn=on;document.body.classList.toggle('still',!on);
  if(!on){document.body.classList.remove('moving');clearTimeout(mTimer)} else kick();
  $('motion').textContent='Motion: '+(on?'on':'off');store('motion',on?'1':'0');
}

$('next').onclick=next;$('prev').onclick=()=>go(cur-1);$('reveal').onclick=reveal;$('hide').onclick=hide;
$('motion').onclick=()=>setMotion(!motionOn);
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();next()}
  else if([' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();reveal()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='r'||e.key==='R') reveal();
  else if(e.key==='h'||e.key==='H') hide();
  else if(e.key==='m'||e.key==='M') setMotion(!motionOn);
});

function fit(){
  const s=Math.min(window.innerWidth/1600,window.innerHeight/900);
  $('stage').style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',()=>{fit();moveSub()});
fit();

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const savedM=load('motion');
setMotion(savedM===null?!reduce:savedM==='1');
const saved=parseInt(load('slide'),10);
secs[0].classList.add('cur');
go(Number.isInteger(saved)&&saved<secs.length?saved:0);
moveSub();
</script>
